[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-defense"
version = "0.1.0"
description = "Certified smoke-screen defense models for the school contest B problem"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=1.26",
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "scipy>=1.16",
    "shapely>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
